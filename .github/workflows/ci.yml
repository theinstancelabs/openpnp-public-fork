name: CI

# The gate for the integration branch (il/integration) and every PR (INF-01, owner: Infra role). One required check,
# "gate": in the merge queue (merge_group) and on pushes, green only if every job below passed; on a PR without the
# label full-ci, the UI end-to-end and SIM acceptance jobs are skipped (the fast gate) and run in the queue. A green
# push to il/integration also publishes a versioned build as a GitHub prerelease, which the lab computer's deployer
# installs when the machine is idle (INF-02, infra/deploy/). The queue fast-forwards il/integration to the very commit
# its merge_group run gated, so that push skips each test job the queue run passed (job queued) and builds, gates and
# releases in minutes.
# What runs where: infra/README.md.

on:
  # A PR runs the fast gate (the UI end-to-end and SIM acceptance jobs only with the label full-ci); the merge queue
  # (merge_group) runs the full gate, and the push to il/integration every test job its queue run did not pass.
  # Releases come from the push run only.
  pull_request:
    types: [opened, synchronize, reopened, labeled]  # labeled: adding full-ci runs the slow jobs
  merge_group:
    types: [checks_requested]
  push:
    branches: [il/integration]
  workflow_dispatch:

# A PR's newer run cancels its older one. Push, merge-queue and manual runs never share a group: GitHub keeps one
# pending run per group and cancels the older pending one, which would drop an il/integration merge's gate and release,
# or a queued PR's gate. The deployer orders releases by run number and accepts ancestors, so parallel push runs are safe.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-{0}-{1}', github.event_name, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  JAR: target/openpnp-gui-0.0.1-alpha-SNAPSHOT.jar
  PLAYWRIGHT_VERSION: 1.64.1
  UINAV_REF: 540d89cce496eab9bda30d065f529aca0a52904d

jobs:
  build:
    name: Build (checkstyle, compile, package)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: ${{ github.event_name != 'merge_group' && 'maven' || '' }}  # queue runs restore nothing
      - name: Package
        run: mvn -B -T1 -DskipTests package
      - uses: actions/upload-artifact@v7
        with:
          name: openpnp-build
          path: |
            target/openpnp-gui-*.jar
            target/lib/
          retention-days: 1
          if-no-files-found: error

  queued:
    # Which test jobs this commit's merge_group run passed, by job id (its gate's gate-needs artifact): a push skips
    # those. Only a push to il/integration asks; anything unexpected (an API error, no such run, no artifact) answers
    # [] and every test job runs here. Every test job needs it, so if this job itself fails (a lost runner), they are
    # skipped and the gate is red, as for a failed build.
    name: Passed in the merge queue
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read  # the commit's merge_group runs and their artifacts
    outputs:
      passed: ${{ steps.find.outputs.passed }}
    steps:
      - name: The test jobs this commit's queue run passed
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          passed='[]'
          if [ "$EVENT" = push ] && [ "$GITHUB_REF" = refs/heads/il/integration ] &&
              timeout 60 gh api "repos/$GITHUB_REPOSITORY/actions/runs?event=merge_group&head_sha=$GITHUB_SHA" \
                > runs.json; then
            run=$(jq -r --arg sha "$GITHUB_SHA" '[.workflow_runs[] | select(.event == "merge_group"
                and (.path | split("@")[0]) == ".github/workflows/ci.yml" and .head_sha == $sha
                and (.head_branch | startswith("gh-readonly-queue/il/integration/"))
                and (.status != "completed" or .conclusion == "success")) | .id] | max // empty' runs.json) || run=
            # its gate job, not the run: GitHub can mark a run completed minutes after its last job (11-04: 12 min, in
            # an incident), while the queue merges on the gate job's check, so that job has finished when this looks
            if [ -n "$run" ] && timeout 60 gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs?filter=latest&per_page=100" \
                  > jobs.json &&
                jq -e '[.jobs[] | select(.name == "gate")] | length == 1 and .[0].status == "completed"
                    and .[0].conclusion == "success"' jobs.json > /dev/null &&
                timeout 120 gh run download "$run" -R "$GITHUB_REPOSITORY" -n gate-needs -D gate-needs
            then
              # a job counts only if it passed there: one skipped there (a partial run) runs here
              passed=$(jq -ce 'if type == "object" then [to_entries[] | select(.value.result == "success") | .key]
                  | sort else [] end' gate-needs/needs.json) || passed='[]'
            fi
          fi
          echo "passed=$passed" | tee -a "$GITHUB_OUTPUT"

  infra:
    name: Infra self-tests (CI helpers, deploy, lumen-sim)
    needs: queued
    if: ${{ !contains(fromJSON(needs.queued.outputs.passed), 'infra') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: unittest
        run: |
          set -e
          for t in infra/*/tests; do
            d="$(dirname "$t")"
            echo "::group::$d"
            python3 -m unittest discover -v -s "$t" -t "$d"
            echo "::endgroup::"
          done
          echo "::group::src/test/web"; python3 -m unittest discover -v -s src/test/web -p 'test_*.py'; echo "::endgroup::"

  maven:
    name: Unit + simulated-machine integration (mvn test)
    needs: queued
    if: ${{ !contains(fromJSON(needs.queued.outputs.passed), 'maven') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: ${{ github.event_name != 'merge_group' && 'maven' || '' }}  # queue runs restore nothing
      - name: Test inputs from infra/fixtures (BR-40 env overrides)
        # LiveBoardPlanTest reads IL_TEST_BOARD and IL_LIVE_CONFIG (without them: the repo's copies, never skipped)
        run: python3 infra/ci/sim_env.py "$RUNNER_TEMP/lab" >> "$GITHUB_ENV"
      - name: mvn test
        # No DISPLAY on the runner, so AWT runs headless; the suite needs no X server.
        run: mvn -B -T1 test
      - name: Counts
        if: always()
        run: python3 infra/ci/surefire_summary.py target/surefire-reports >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 1

  deploy-e2e:
    name: Deploy dry run (real OpenPnP + lumen-sim, deploy and rollback)
    needs: [build, queued]
    if: ${{ !contains(fromJSON(needs.queued.outputs.passed), 'deploy-e2e') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/download-artifact@v8
        with:
          name: openpnp-build
          path: target
      - name: Xvfb
        run: command -v Xvfb >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q xvfb; }
      - name: infra/deploy/e2e
        # INF-02's CI acceptance on the real backend: two releases in CI's format, deploy + health check (enable,
        # home, stop) against lumen-sim on a pty, a second deploy over a running OpenPnP, a rollback, and a deploy
        # after a controller power cycle that must hold without homing. Skipping counts as a failure here.
        env:
          IL_DEPLOY_E2E: '1'
          IL_DEPLOY_E2E_JAR: ${{ env.JAR }}
          IL_DEPLOY_E2E_LIB: target/lib
          IL_DEPLOY_E2E_OUT: ${{ runner.temp }}/deploy-e2e
        run: python3 infra/deploy/e2e/test_deploy_openpnp.py -v
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: deploy-e2e
          path: ${{ runner.temp }}/deploy-e2e/
          if-no-files-found: ignore
          retention-days: 1

  controller-e2e:
    name: Simulated controller behind OpenPnP (home, STOP in G28, long prime)
    needs: [build, queued]
    if: ${{ !contains(fromJSON(needs.queued.outputs.passed), 'controller-e2e') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/sim-env
        with:
          uinav-token: ${{ secrets.UINAV_TOKEN }}
          uinav-ssh-key: ${{ secrets.UINAV_DEPLOY_KEY }}
          playwright: 'false'
      - name: infra/lumen-sim/e2e
        # INF-03's acceptance through the real backend: OpenPnP on lumen-sim's pty (uinav --controller pty) homes,
        # a STOP 4 s into a home reproduces the M410 timeout and the halted controller, and a 30-turn prime at
        # 180 rpm reproduces "timeout waiting for response to G4 P250".
        env:
          LUMEN_SIM_E2E: '1'
        run: LUMEN_SIM_E2E_JAR="$JAR" LUMEN_SIM_E2E_OUT="$RUNNER_TEMP/controller-e2e" python3 infra/lumen-sim/e2e/test_openpnp_pty.py -v
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: controller-e2e
          path: |
            ${{ runner.temp }}/controller-e2e/
            /tmp/openpnp-uinav-*/*/*.log
            /tmp/openpnp-uinav-*/*/openpnp.out
          if-no-files-found: ignore
          retention-days: 1

  ui-e2e:
    # One fresh SIM session per leg (WEBUI_SCRIPTS): infra/ci/webui_shards.py names each leg's scripts; "rest" runs
    # every other script in run-webui-sim-test.sh's ALL_SCRIPTS, so a new UI script needs no change here.
    name: UI end-to-end (${{ matrix.title }})
    needs: [build, queued]
    if: >-
      ${{ !contains(fromJSON(needs.queued.outputs.passed), 'ui-e2e') && (github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'full-ci')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include:
          - {shard: main, title: "webui-sim, board-import, pad-profile, tip-setups, tip-flow"}
          - {shard: rest, title: "lock and the other UI scripts"}
    steps:
      - uses: actions/checkout@v7
      - name: The leg's scripts
        id: shard
        shell: bash  # -eo pipefail: a failing webui_shards.py fails the leg, it never runs nothing and passes
        run: python3 infra/ci/webui_shards.py ${{ matrix.shard }} | tee -a "$GITHUB_OUTPUT"
      - uses: ./.github/actions/sim-env
        if: steps.shard.outputs.scripts != ''
        with:
          uinav-token: ${{ secrets.UINAV_TOKEN }}
          uinav-ssh-key: ${{ secrets.UINAV_DEPLOY_KEY }}
      - name: run-webui-sim-test.sh
        if: steps.shard.outputs.scripts != ''
        env:
          OUT_DIR: ${{ runner.temp }}/webui
          WEBUI_SCRIPTS: ${{ steps.shard.outputs.scripts }}
        run: src/test/web/run-webui-sim-test.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-e2e-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/webui/
            /tmp/openpnp-uinav-*/*/*.log
            /tmp/openpnp-uinav-*/*/openpnp.out
            /tmp/openpnp-uinav-*/*/config/log/
          if-no-files-found: ignore
          retention-days: 1

  ui-boardview:
    name: UI end-to-end (boardview)
    needs: [build, queued]
    if: ${{ !contains(fromJSON(needs.queued.outputs.passed), 'ui-boardview') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/sim-env
        with:
          uinav-token: ${{ secrets.UINAV_TOKEN }}
          uinav-ssh-key: ${{ secrets.UINAV_DEPLOY_KEY }}
      - name: run-boardview-test.sh
        env:
          OUT_DIR: ${{ runner.temp }}/boardview
        run: src/test/web/run-boardview-test.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-boardview
          path: |
            ${{ runner.temp }}/boardview/
            /tmp/il-ui-session-*/
            /tmp/openpnp-uinav-*/*/*.log
            /tmp/openpnp-uinav-*/*/openpnp.out
          if-no-files-found: ignore
          retention-days: 1

  acceptance:
    name: SIM acceptance (${{ matrix.shard }}${{ matrix.controller == 'pty' && ', on lumen-sim' || '' }})
    needs: [build, queued]
    if: >-
      ${{ !contains(fromJSON(needs.queued.outputs.passed), 'acceptance') && (github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'full-ci')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Sharded by measured scenario time (≈ 13-16 min each); together they are il_sim_acceptance.py all.
        shard:
          - padcal:controls
          - padcal:main,nano
          - tips board
          - register stop import load
        controller: [gcodeserver]
        # The backend's load scenario on lumen-sim's pty, which SimGuard accepts through --sim-cap (BR-43, BR-47).
        # register, tips and padcal join it here once BR-69 feeds the SIM vacuum and paste from the pty.
        include:
          - shard: load
            controller: pty
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/sim-env
        with:
          uinav-token: ${{ secrets.UINAV_TOKEN }}
          uinav-ssh-key: ${{ secrets.UINAV_DEPLOY_KEY }}
          playwright: 'false'
      - name: il_sim_acceptance.py
        env:
          UINAV_SIM_CONTROLLER: ${{ matrix.controller == 'pty' && 'pty' || '' }}
          UINAV_SIM_CONTROLLER_CAP: ${{ matrix.controller == 'pty' && '1' || '' }}
          LUMEN_SIM_DIR: ${{ github.workspace }}/infra/lumen-sim
        run: python3 infra/ci/acceptance.py run --shard "${{ matrix.shard }}" --out "$RUNNER_TEMP/acc" --jar "$JAR"
      - name: Artifact name
        if: always()
        id: name
        run: echo "slug=$(echo '${{ matrix.shard }} ${{ matrix.controller }}' | tr ' :,' '---')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: acceptance-${{ steps.name.outputs.slug }}
          path: |
            ${{ runner.temp }}/acc/
            /tmp/openpnp-uinav-*/*/*.log
            /tmp/openpnp-uinav-*/*/openpnp.out
          if-no-files-found: ignore
          retention-days: 1

  gate:
    name: gate
    if: always()
    timeout-minutes: 10  # a hung step must not hold the queue's required check for hours
    needs: [queued, build, infra, maven, deploy-e2e, controller-e2e, ui-e2e, ui-boardview, acceptance]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read  # the run's jobs, for the second step
    steps:
      - name: Every job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
          FULL: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.value.result)\t\(.key)"'
          if [ "$EVENT" = pull_request ] && [ "$FULL" != true ]; then
            # the fast gate: the slow jobs run in the merge queue (label a PR full-ci to run them here too)
            echo "$NEEDS" | jq -e 'length > 0 and all(to_entries[]; .value.result == "success" or
              ((.key == "ui-e2e" or .key == "acceptance") and .value.result == "skipped"))' >/dev/null
          elif [ "$EVENT" = push ]; then
            # a test job this commit's queue run passed is skipped here (job queued); every other job must pass
            echo "$NEEDS" | jq -e '(.queued.outputs.passed // "[]" | fromjson) as $passed | length > 0
              and .queued.result == "success" and .build.result == "success" and all(to_entries[];
              .value.result == "success" or (.value.result == "skipped" and (.key | IN($passed[]))))' >/dev/null
          else
            echo "$NEEDS" | jq -e 'length > 0 and all(.[]; .result == "success")' >/dev/null
          fi
      - name: No job of this run failed or was cancelled
        # needs can report a matrix job 'success' while one of its legs was cancelled before a runner took it
        # (a GitHub bug, 10-2026): the run's own job list has every leg
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?filter=latest&per_page=100" > jobs.json
          jq -r '.jobs[] | select(.name != "gate" and (.name | startswith("Release") | not))
            | select(.conclusion != null and .conclusion != "success" and .conclusion != "skipped")
            | "\(.conclusion)\t\(.name)"' jobs.json > bad.txt
          if [ -s bad.txt ]; then echo "jobs of this run that did not pass:"; cat bad.txt; exit 1; fi
      - name: What this queue run passed, by job (the push of this commit skips those)
        # after both verdicts, so it exists only for a green queue run; a failed write or upload never fails the
        # gate (it would eject the PR): the push then runs every test job
        if: github.event_name == 'merge_group'
        continue-on-error: true
        timeout-minutes: 1
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: echo "$NEEDS" > needs.json
      - uses: actions/upload-artifact@v7  # fetched at the job's set-up as for build, which the gate needs anyway
        if: github.event_name == 'merge_group'
        continue-on-error: true
        timeout-minutes: 2  # a hang would hold the required check until the queue ejects the PR
        with:
          name: gate-needs
          path: needs.json
          retention-days: 1
          overwrite: true  # a re-run's gate replaces it
          if-no-files-found: error

  release:
    name: Release (versioned build for the deployer)
    needs: [gate]
    # !cancelled(): without a status function GitHub adds success() over every job before the gate, so a push whose
    # test jobs were skipped (job queued) would never release
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/il/integration' && needs.gate.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: openpnp-build
          path: target
      - name: Package
        run: |
          set -euo pipefail
          TAG="il-build-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          python3 infra/ci/make_release.py --jar "$JAR" --lib target/lib --tag "$TAG" --sha "$GITHUB_SHA" \
            --branch "${GITHUB_REF_NAME}" --run-id "$GITHUB_RUN_ID" --run-number "$GITHUB_RUN_NUMBER" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --out "$RUNNER_TEMP/rel"
      - name: Attest (binds the tarball's bytes to this workflow, ref and commit)
        # The deployer runs 'gh attestation verify' with --signer-workflow ci.yml, --source-ref il/integration and
        # --source-digest <sha>: a release published by anything else (another workflow, a hand upload) is refused.
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ runner.temp }}/rel/openpnp-il-*.tar.gz
      - name: Publish
        # A release already at the tag (a re-run finds what an earlier attempt published) passes only if it is this
        # run's own: published by github-actions[bot] at this commit, BUILD-INFO naming this run, its tarball attested
        # by this run under the deployer's policy. Anything else there fails the run instead of leaving it green with
        # its build unreleased.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 infra/ci/publish_release.py --dir "$RUNNER_TEMP/rel" --tag "$TAG" --sha "$GITHUB_SHA" \
            --repo "$GITHUB_REPOSITORY" --branch "$GITHUB_REF_NAME" --run-id "$GITHUB_RUN_ID" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  prune-artifacts:
    name: Keep only the newest build artifact
    needs: [release]
    # The user (11-04 20:2x, 62 GB of artifacts): only the newest openpnp-build is kept. Each run downloads its own
    # within the run and no job reads an older run's, so a succeeded or cancelled run's build is dead weight; a failed
    # run keeps its own for `gh run rerun --failed` until it expires. Its own job: the release keeps exactly the
    # permissions publishing needs. A prune that fails or times out never turns the released run red.
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
      - name: Delete every openpnp-build but this run's, unfinished runs' and failed runs'
        continue-on-error: true
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 infra/ci/prune_artifacts.py --repo "$GITHUB_REPOSITORY" --keep-run "$GITHUB_RUN_ID"
