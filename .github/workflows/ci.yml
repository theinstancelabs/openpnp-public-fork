name: CI

# The gate for the integration branch (il/integration) and every PR (INF-01, owner: Infra role). One required check:
# "gate", green only if every job below passed. A green push to il/integration also publishes a versioned build as a
# GitHub prerelease, which the lab computer's deployer installs when the machine is idle (INF-02, infra/deploy/).
# What runs where: infra/README.md.

on:
  pull_request:
  push:
    branches: [il/integration]
  workflow_dispatch:

# Push and manual (workflow_dispatch) runs of one branch in separate groups: a newer run cancels a pending one of its
# group, and only push runs release, so a manual re-check must never replace the head's pending push run.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  JAR: target/openpnp-gui-0.0.1-alpha-SNAPSHOT.jar
  PLAYWRIGHT_VERSION: 1.64.1
  UINAV_REF: e33cab3155c5451c546bf6ce362b85b8892b76e4

jobs:
  build:
    name: Build (checkstyle, compile, package)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Package
        run: mvn -B -T1 -DskipTests package
      - uses: actions/upload-artifact@v7
        with:
          name: openpnp-build
          path: |
            target/openpnp-gui-*.jar
            target/lib/
          retention-days: 7
          if-no-files-found: error

  infra:
    name: Infra self-tests (CI helpers, deploy, lumen-sim)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: unittest
        run: |
          set -e
          for t in infra/*/tests; do
            d="$(dirname "$t")"
            echo "::group::$d"
            python3 -m unittest discover -v -s "$t" -t "$d"
            echo "::endgroup::"
          done

  maven:
    name: Unit + simulated-machine integration (mvn test)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: mvn test
        # No DISPLAY on the runner, so AWT runs headless; the suite needs no X server.
        run: mvn -B -T1 test
      - name: Counts
        if: always()
        run: python3 infra/ci/surefire_summary.py target/surefire-reports >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14

  ui-e2e:
    name: UI end-to-end (webui-sim, board-import, pad-profile, tip-setups)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/sim-env
        with:
          uinav-token: ${{ secrets.UINAV_TOKEN }}
          uinav-ssh-key: ${{ secrets.UINAV_DEPLOY_KEY }}
      - name: run-webui-sim-test.sh
        env:
          OUT_DIR: ${{ runner.temp }}/webui
        run: src/test/web/run-webui-sim-test.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-e2e
          path: |
            ${{ runner.temp }}/webui/
            /tmp/openpnp-uinav-*/*/*.log
            /tmp/openpnp-uinav-*/*/openpnp.out
            /tmp/openpnp-uinav-*/*/config/log/
          if-no-files-found: ignore
          retention-days: 14

  ui-boardview:
    name: UI end-to-end (boardview)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/sim-env
        with:
          uinav-token: ${{ secrets.UINAV_TOKEN }}
          uinav-ssh-key: ${{ secrets.UINAV_DEPLOY_KEY }}
      - name: run-boardview-test.sh
        env:
          OUT_DIR: ${{ runner.temp }}/boardview
        run: src/test/web/run-boardview-test.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-boardview
          path: |
            ${{ runner.temp }}/boardview/
            /tmp/il-ui-session-*/
            /tmp/openpnp-uinav-*/*/*.log
            /tmp/openpnp-uinav-*/*/openpnp.out
          if-no-files-found: ignore
          retention-days: 14

  acceptance:
    name: SIM acceptance (${{ matrix.shard }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Sharded by measured scenario time (≈ 13-16 min each); together they are il_sim_acceptance.py all.
        shard:
          - padcal:controls
          - padcal:main,nano
          - tips board
          - register stop import load
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/sim-env
        with:
          uinav-token: ${{ secrets.UINAV_TOKEN }}
          uinav-ssh-key: ${{ secrets.UINAV_DEPLOY_KEY }}
          playwright: 'false'
      - name: il_sim_acceptance.py
        run: python3 infra/ci/acceptance.py run --shard "${{ matrix.shard }}" --out "$RUNNER_TEMP/acc" --jar "$JAR"
      - name: Artifact name
        if: always()
        id: name
        run: echo "slug=$(echo '${{ matrix.shard }}' | tr ' :,' '---')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: acceptance-${{ steps.name.outputs.slug }}
          path: |
            ${{ runner.temp }}/acc/
            /tmp/openpnp-uinav-*/*/*.log
            /tmp/openpnp-uinav-*/*/openpnp.out
          if-no-files-found: ignore
          retention-days: 14

  deploy-e2e:
    name: Deploy end-to-end (il_deploy with the real jar on lumen-sim)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/download-artifact@v8
        with:
          name: openpnp-build
          path: target
      - name: Xvfb
        run: command -v Xvfb >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q xvfb; }
      - name: test_deploy_openpnp.py
        # Run as a script: with IL_DEPLOY_E2E=1 a skip (no jar, no Xvfb) exits 1, so a miswired job cannot pass.
        env:
          IL_DEPLOY_E2E: '1'
          IL_DEPLOY_E2E_JAR: ${{ env.JAR }}
          IL_DEPLOY_E2E_LIB: target/lib
          IL_DEPLOY_E2E_OUT: ${{ runner.temp }}/deploy-e2e
        run: python3 infra/deploy/e2e/test_deploy_openpnp.py -v
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: deploy-e2e
          path: ${{ runner.temp }}/deploy-e2e/
          if-no-files-found: ignore
          retention-days: 14

  gate:
    name: gate
    if: always()
    needs: [build, infra, maven, ui-e2e, ui-boardview, acceptance, deploy-e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.value.result)\t\(.key)"'
          echo "$NEEDS" | jq -e 'length > 0 and all(.[]; .result == "success")' >/dev/null

  release:
    name: Release (versioned build for the deployer)
    needs: [gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/il/integration' && needs.gate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: openpnp-build
          path: target
      - name: Package and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="$GITHUB_SHA"; SHA7="${SHA:0:7}"
          TAG="il-build-${GITHUB_RUN_NUMBER}-${SHA7}"
          python3 infra/ci/make_release.py --jar "$JAR" --lib target/lib --tag "$TAG" --sha "$SHA" \
            --branch "${GITHUB_REF_NAME}" --run-id "$GITHUB_RUN_ID" --run-number "$GITHUB_RUN_NUMBER" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --out "$RUNNER_TEMP/rel"
          gh release create "$TAG" --target "$SHA" --prerelease --latest=false --title "$TAG" \
            --notes "Green build of il/integration at $SHA (CI run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID). Installed on the lab computer by infra/deploy when the machine is idle." \
            "$RUNNER_TEMP/rel/openpnp-il-$SHA7.tar.gz" "$RUNNER_TEMP/rel/openpnp-il-$SHA7.tar.gz.sha256" \
            "$RUNNER_TEMP/rel/BUILD-INFO.json"
